# Klijentska galerija (zasebna Netlify stranica, zasebna adresa od admin aplikacije).
# Zašto zasebno: ova stranica je javna, a admin aplikacija nije. Na različitim adresama preglednik
# drži njihove podatke strogo odvojeno, pa propust ovdje nikad ne dotiče tvoju prijavu.

[build]
  command = "npm run build"
  publish = "dist"

# pregled linka (WhatsApp, Instagram) dobije naslov i naslovnu sliku galerije
[[edge_functions]]
  path = "/g/*"
  function = "og"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # preglednik smije učitavati samo: ovu stranicu, backend (podatke), R2 (fotke) i Google Fonts
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.r2.cloudflarestorage.com; media-src https://*.r2.cloudflarestorage.com; connect-src 'self' https://*.onrender.com https://*.r2.cloudflarestorage.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    # adresa s tokenom nikad ne napušta stranicu (npr. klik na Instagram)
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
